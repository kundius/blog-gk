services:
  backend:
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    command: sh -c "npx prisma generate && npx nest start --watch"
    ports:
      - "51212:51212"

  site:
    volumes:
      - ./site/src:/app/src
      - ./site/package.json:/app/package.json
      - ./site/package-lock.json:/app/package-lock.json
      - ./site/next.config.js:/app/next.config.js
      - ./site/.env:/app/.env
    command: npm run dev

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "5050:80"
    env_file: ./.env
    depends_on:
      - postgres
