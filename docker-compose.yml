services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    expose:
      - 5432
    env_file: ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    expose:
      - 4000
    depends_on:
      - postgres

  opencode:
    build:
      context: ./opencode
    env_file: ./opencode/.env
    volumes:
      - ./opencode:/app
    restart: unless-stopped
    expose:
      - 5023

  site:
    build:
      context: ./site
    network_mode: "service:gateway"
    env_file: ./site/.env
    restart: unless-stopped
    depends_on:
      - gateway

  gateway:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "5021:5021"
      - "5022:5022"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - backend

volumes:
  postgres_data:
